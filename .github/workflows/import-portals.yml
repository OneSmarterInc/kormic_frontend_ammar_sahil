name: Import pinned frontend sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-portals.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-portals
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import source snapshots without changing source repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          sources = {
            'student': ('Kormic_frontend_student_sahil_ammar', '2e88970c0e97b72c0f94183fe76d22f797384f79'),
            'university': ('Kormic_frontend_University_sahil_ammar', 'd24574859c62ad22dbd1548bae04e889667a1763'),
            'institute': ('Kormic_frontend_Institutes_sahil_ammar', '2d3a09cb21342fa96de9aee0b8075fef09b56341'),
            'superuser': ('Kormic_frontend_Superuser_sahil_ammar', 'db721d34e319a7e17fe70fb567c99967615bb863'),
          }
          manifest = {}
          for role, (repo, sha) in sources.items():
            dest = pathlib.Path('apps') / role
            if dest.exists():
              raise SystemExit(f'Refusing to overwrite existing portal: {dest}')
            with tempfile.TemporaryDirectory() as temp:
              subprocess.run(['git', 'init', '-q', temp], check=True)
              subprocess.run(['git', '-C', temp, 'fetch', '--depth=1', f'https://github.com/OneSmarterInc/{repo}.git', sha], check=True)
              actual = subprocess.check_output(['git', '-C', temp, 'rev-parse', 'FETCH_HEAD'], text=True).strip()
              if actual != sha:
                raise SystemExit(f'Source SHA mismatch: {repo}')
              dest.mkdir(parents=True)
              archive = subprocess.Popen(['git', '-C', temp, 'archive', sha], stdout=subprocess.PIPE)
              subprocess.run(['tar', '-x', '-C', str(dest)], stdin=archive.stdout, check=True)
              archive.stdout.close()
              if archive.wait() != 0:
                raise SystemExit('git archive failed')
            manifest[role] = {'repository': f'OneSmarterInc/{repo}', 'commit': sha}
          pathlib.Path('SOURCE_MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps SOURCE_MANIFEST.json
          git commit -m "Import four pinned Kormic portal source snapshots"
          git push origin HEAD:main
      - name: Package imported source for verification
        run: tar -czf /tmp/kormic-import.tar.gz apps SOURCE_MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: imported-portals
          path: /tmp/kormic-import.tar.gz
          retention-days: 3
