name: Import approved source batches
on:
  push:
    branches: [main]
    paths: [migration/batches/**, migration/import_batch.py, .github/workflows/import-batch.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: one-time-migration-key
          run-id: 35567961764
          github-token: ${{ github.token }}
          path: /tmp/migration-key
      - name: Import and validate source batches
        run: |
          python3 migration/import_batch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps migration/imported.json 2>/dev/null || git add migration/imported.json
          if ! git diff --cached --quiet; then
            git commit -m "Import hash-verified original portal source files"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Package current source for integration testing
        run: |
          mkdir -p apps
          tar -czf /tmp/source.tar.gz apps migration/imported.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: /tmp/source.tar.gz
          retention-days: 1
      - name: Remove ephemeral key from runner
        if: always()
        run: rm -rf /tmp/migration-key
